name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: CompeyDev/setup-rokit@v0.2.1
      - name: Generate the Roblox standard library for Selene
        run: selene generate-roblox-std
      - name: Lint (Selene)
        run: selene src tests
      - name: Format check (StyLua)
        run: stylua --check src tests
      - name: Tests (Lune)
        run: lune run tests/run
      - name: Build the place file (Rojo)
        run: |
          mkdir -p build
          rojo build -o build/NightShift.rbxl
      - uses: actions/upload-artifact@v7
        with:
          name: NightShift-place
          path: build/NightShift.rbxl
          retention-days: 7
